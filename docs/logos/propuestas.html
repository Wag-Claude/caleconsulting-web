<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuestas de logo — Cale Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#101010; --deep:#0b0b0b; --lift:#1d1a18; --stroke:#3d3a39; --granite:#8a8380; --stone:#b8b3b0; --bone:#eeeeee; --chalk:#fafafa; --orange:#ee6018; --ink:#101010; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--bone); font-family:'Geist',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1200px; margin:0 auto; padding:56px 24px 96px; }
  .mono { font-family:'Geist Mono',ui-monospace,monospace; font-size:12px; text-transform:uppercase; letter-spacing:-.02em; }
  h1 { font-weight:400; font-size:44px; letter-spacing:-.03em; margin:12px 0 8px; }
  .intro { color:var(--granite); max-width:640px; margin:0 0 48px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr)); gap:16px; }
  .card { border:1px solid var(--lift); border-radius:12px; overflow:hidden; background:var(--deep); display:flex; flex-direction:column; }
  .card.current { border-style:dashed; }
  .hero { --bg:var(--deep); color:var(--bone); display:grid; place-items:center; height:200px; border-bottom:1px solid var(--lift);
          background: radial-gradient(circle at 50% 50%, rgba(238,96,24,.10), transparent 60%), var(--deep); }
  .hero svg { width:104px; height:104px; }
  .row { display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--lift); }
  .row.dark { --bg:var(--canvas); background:var(--canvas); color:var(--bone); }
  .row.light { --bg:var(--bone); background:var(--bone); color:var(--ink); }
  .lockup { display:flex; align-items:center; gap:10px; }
  .lockup svg { width:34px; height:34px; flex:none; }
  .lockup .name { font-size:clamp(20px,6vw,25px); font-weight:500; letter-spacing:-.035em; white-space:nowrap; }
  .lockup .name em { font-style:normal; opacity:.72; }
  .icons { --bg:var(--canvas); display:flex; align-items:end; gap:16px; padding:16px 20px; border-bottom:1px solid var(--lift); color:var(--bone); }
  .icons .tile { background:var(--canvas); border:1px solid var(--lift); border-radius:6px; display:grid; place-items:center; }
  .icons .t16 { width:28px; height:28px; } .icons .t16 svg { width:16px; height:16px; }
  .icons .t32 { width:44px; height:44px; } .icons .t32 svg { width:32px; height:32px; }
  .icons .t64 { width:80px; height:80px; border-radius:16px; } .icons .t64 svg { width:56px; height:56px; }
  .icons .lbl { color:var(--granite); margin-left:auto; align-self:center; }
  .info { padding:20px; }
  .info h2 { font-size:22px; font-weight:400; letter-spacing:-.02em; margin:6px 0 8px; }
  .info p { color:var(--granite); font-size:14px; margin:0 0 10px; }
  .info .tag { color:var(--stone); }
  .num { color:var(--orange); }
  .soft { opacity:.5; }
</style>
</head>
<body>
<div class="wrap">
  <span class="mono num">Cale Consulting · Logo</span>
  <h1>5 propuestas de logo</h1>
  <p class="intro">Cada propuesta aparece en grande, junto al nombre sobre fondo oscuro y claro, y en tamaño ícono (pestaña del navegador y app). Todas usan la paleta de la marca: blanco hueso, gris cálido y el naranja como acento.</p>

  <!-- Símbolos: el color principal es currentColor; --bg es el color del fondo donde se apoya -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="m0" viewBox="0 0 32 32">
      <path d="M23.07 8.93A10 10 0 1 0 23.07 23.07" fill="none" stroke="currentColor" stroke-width="3.2"/>
      <circle cx="24.6" cy="16" r="2.6" fill="#ee6018"/>
    </symbol>
    <symbol id="m1" viewBox="0 0 32 32">
      <path d="M24.08 7.97A12.5 12.5 0 1 0 24.08 24.03" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <path class="soft" d="M20.25 11.18A7.5 7.5 0 1 0 20.25 20.82" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="14.5" cy="16" r="2.6" fill="#ee6018"/>
    </symbol>
    <symbol id="m2" viewBox="0 0 32 32">
      <path class="soft" d="M23.78 8.22A11 11 0 1 0 23.78 23.78" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="23.78" cy="8.22" r="2.6" fill="currentColor"/>
      <circle cx="11.79" cy="5.84" r="2.6" fill="currentColor"/>
      <circle cx="5" cy="16" r="2.6" fill="currentColor"/>
      <circle cx="11.79" cy="26.16" r="2.6" fill="currentColor"/>
      <circle cx="23.78" cy="23.78" r="2.9" fill="#ee6018"/>
    </symbol>
    <symbol id="m3" viewBox="0 0 32 32">
      <path d="M25.19 8.29A12 12 0 1 0 25.19 23.71" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <ellipse class="soft" cx="16" cy="16" rx="5" ry="12" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path class="soft" d="M4 16h17" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="27.4" cy="16" r="2.6" fill="#ee6018"/>
    </symbol>
    <symbol id="m4" viewBox="0 0 32 32">
      <path d="M21.07 8.93A10 10 0 1 0 21.07 23.07" fill="none" stroke="currentColor" stroke-width="3.2"/>
      <path d="M24.5 10.5C25 14.4 26.1 15.5 30 16 26.1 16.5 25 17.6 24.5 21.5 24 17.6 22.9 16.5 19 16 22.9 15.5 24 14.4 24.5 10.5Z" fill="#ee6018"/>
    </symbol>
    <symbol id="m5" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="7" fill="currentColor"/>
      <path d="M17.95 11.05A7 7 0 1 0 17.95 20.95" fill="none" stroke="var(--bg)" stroke-width="3"/>
      <rect x="20.5" y="19.5" width="6.5" height="3" fill="#ee6018"/>
    </symbol>
  </svg>

  <div class="grid" id="grid"></div>
</div>

<script>
  const P = [
    { id: 'm1', n: '01', t: 'Señal', idea: 'Una "C" hecha de ondas concéntricas, como una señal Wi-Fi que se expande desde el punto naranja.', tag: 'Redes · Wi-Fi · Conectividad' },
    { id: 'm2', n: '02', t: 'Red', idea: 'La "C" se forma con nodos conectados, como un diagrama de red. El último nodo, en naranja, es el cliente conectado.', tag: 'Redes · Partners · Integración' },
    { id: 'm3', n: '03', t: 'Globo', idea: 'La "C" es un globo terráqueo abierto, con meridiano y ecuador. El punto naranja es una conexión hacia afuera.', tag: 'Conectividad internacional · Alcance global' },
    { id: 'm4', n: '04', t: 'Chispa', idea: 'Una "C" firme con un destello de IA en su apertura: tecnología sólida que incorpora inteligencia.', tag: 'Consultoría · IA · Innovación' },
    { id: 'm5', n: '05', t: 'Terminal', idea: 'Un ícono cuadrado con la "C" y un cursor naranja ( C_ ), como una línea de comando lista para actuar. Funciona muy bien como ícono de app y de redes sociales.', tag: 'Tecnología · Ingeniería · Precisión' },
    { id: 'm0', n: '00', t: 'Actual (referencia)', idea: 'El logo de hoy: una "C" abierta con un punto de señal naranja.', tag: 'Para comparar', current: true }
  ];
  const use = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
  const lock = id => `<div class="lockup">${use(id)}<span class="name">Cale <em>Consulting</em></span></div>`;
  document.getElementById('grid').innerHTML = P.map(p => `
    <article class="card${p.current ? ' current' : ''}">
      <div class="hero">${use(p.id)}</div>
      <div class="row dark">${lock(p.id)}</div>
      <div class="row light">${lock(p.id)}</div>
      <div class="icons"><span class="tile t16">${use(p.id)}</span><span class="tile t32">${use(p.id)}</span><span class="tile t64">${use(p.id)}</span><span class="lbl mono">Ícono / app</span></div>
      <div class="info">
        <span class="mono num">Propuesta ${p.n}</span>
        <h2>${p.t}</h2>
        <p>${p.idea}</p>
        <span class="mono tag">${p.tag}</span>
      </div>
    </article>`).join('');
</script>
</body>
</html>
